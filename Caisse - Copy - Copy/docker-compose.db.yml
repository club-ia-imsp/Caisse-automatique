services:
  db:
    image: ankane/pgvector:latest
    container_name: automaticcheck_db
    environment:
      POSTGRES_USER: foodlink
      POSTGRES_PASSWORD: foodlink_secure_2024
      POSTGRES_DB: foodlink_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodlink -d foodlink_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
