name: automaticcheck

services:

  # ──────────────────────────────────────────
  #  PostgreSQL + pgvector
  # ──────────────────────────────────────────
  db:
    image: ankane/pgvector:latest
    container_name: automaticcheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-foodlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodlink_secure_2024}
      POSTGRES_DB:       ${POSTGRES_DB:-foodlink_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodlink} -d ${POSTGRES_DB:-foodlink_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ──────────────────────────────────────────
  #  Backend FastAPI
  # ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: automaticcheck_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-foodlink}:${POSTGRES_PASSWORD:-foodlink_secure_2024}@db:5432/${POSTGRES_DB:-foodlink_db}
      SECRET_KEY:                    ${SECRET_KEY:-foodlink-super-secret-key-change-in-production-2024}
      ALGORITHM:                     HS256
      ACCESS_TOKEN_EXPIRE_MINUTES:   "480"
      DEFAULT_ADMIN_USERNAME:        ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD:        ${DEFAULT_ADMIN_PASSWORD:-admin123}
      YOLO_MODEL:                    /app/best_caisse.pt
      EMBEDDING_DIM:                 "512"
      SIMILARITY_THRESHOLD:          "0.30"
      UPLOAD_DIR:                    /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  # ──────────────────────────────────────────
  #  Frontend React (nginx)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automaticcheck_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

# ──────────────────────────────────────────
#  Volumes persistants
# ──────────────────────────────────────────
volumes:
  pgdata:
  uploads:
